[package]
name = "WaifuTagger"
version = "0.1.0"
description = "An anime tagger app"
authors = ["KuzuLabz", "Smashinfries"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22.1"
tauri-plugin-http = "2"
md5 = "0.8.1"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
ndarray = "0.17.2"
image = "0.25.6"
bytemuck = "1.25.2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-vnidrop-share = "1.0.0-rc.2"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
fs_extra = "1.3.0"
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2.0.0", features = ["watch"] }
tauri-plugin-persisted-scope = "2"
sysinfo = "0.36.1"
read_my_vram = { version = "0.6.0", features = ["serde"] }
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
default = []

directml = ["ort/directml"]
coreml = ["ort/coreml"]

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
